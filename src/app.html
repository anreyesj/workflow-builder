<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			/* ── Design tokens ── */
			:root {
				--color-bg-panel: #1e1e2e;
				--color-bg-header: #181825;
				--color-bg-code: #11111b;
				--color-bg-input: #2a2a3d;
				--color-bg-card: #252537;
				--color-bg-selected: #2d2d4d;
				--color-border: #313244;
				--color-accent: #7c6ff7;
				--color-accent-dark: #6457d9;
				--color-accent-light: #a89cf7;
				--color-text-primary: #cdd6f4;
				--color-text-secondary: #a6adc8;
				--color-text-muted: #6c7086;
				--color-code-text: #a6e3a1;
				--color-danger: #f38ba8;
				--font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
			}

			/* ── Reset ── */
			*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

			html, body {
				height: 100%;
				overflow: hidden;
				background: var(--color-bg-code);
				color: var(--color-text-primary);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				font-size: 14px;
				line-height: 1.5;
			}

			/* ── Scrollbars ── */
			::-webkit-scrollbar { width: 6px; height: 6px; }
			::-webkit-scrollbar-track { background: transparent; }
			::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
			::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

			/* ── Form elements ── */
			input, textarea, select {
				font-family: inherit;
				color: var(--color-text-primary);
			}

			select option { background: var(--color-bg-panel); }

			button { font-family: inherit; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
